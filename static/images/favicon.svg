<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- teal background -->
  <rect width="100" height="100" fill="#003030" rx="16"/>

  <!-- hook — bold white J-curve -->
  <path d="M38 22 C38 22 22 22 22 42 C22 58 36 64 46 58"
        stroke="#f5f1e8" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- fly body — orange oval sitting on the hook bend -->
  <ellipse cx="58" cy="56" rx="20" ry="9" fill="#E07030"/>

  <!-- three bold hackle lines fanning right -->
  <g stroke="#f5f1e8" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="76" y1="56" x2="90" y2="44"/>
    <line x1="77" y1="57" x2="92" y2="57"/>
    <line x1="76" y1="58" x2="90" y2="70"/>
  </g>
</svg>
